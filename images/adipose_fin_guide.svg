<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="auto" style="background:#0d1117; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif; border-radius: 8px;">
  <style>
    .title { fill: #f0f3f6; font-size: 17px; font-weight: 700; }
    .sub { fill: #8b949e; font-size: 13px; }
    .label { fill: #f0f3f6; font-size: 13px; font-weight: 600; }
    .status-bad { fill: #f87171; font-weight: 700; font-size: 13px; }
    .status-good { fill: #34d399; font-weight: 700; font-size: 13px; }
    .box-bad { stroke: #ef4444; stroke-width: 2; fill: rgba(239,68,68,0.1); rx: 6; }
    .box-good { stroke: #10b981; stroke-width: 2; fill: rgba(16,185,129,0.1); rx: 6; }
  </style>
  <text x="400" y="32" text-anchor="middle" class="title">TROUT ADIPOSE FIN IDENTIFICATION • 鳟鱼脂鳍鉴别指南</text>
  <text x="400" y="52" text-anchor="middle" class="sub">Check the dorsal fleshy fin between the dorsal fin and tail before keeping any trout in Finland</text>

  <!-- Left: Wild Trout -->
  <g transform="translate(40, 80)">
    <rect width="340" height="250" class="box-bad"/>
    <text x="170" y="28" text-anchor="middle" class="status-bad">⚠️ WILD TROUT • RASVAEVÄLLINEN (WILD)</text>
    <text x="170" y="48" text-anchor="middle" class="sub">Adipose fin INTACT • 脂鳍完整保留</text>
    
    <!-- Fish outline with adipose fin -->
    <path d="M 40,140 Q 90,85 180,85 Q 240,88 280,115 L 300,90 L 300,165 L 280,140 Q 220,165 150,165 Q 90,165 40,140 Z" fill="#2d3748" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Dorsal Fin -->
    <path d="M 140,85 L 165,55 L 185,85 Z" fill="#475569" stroke="#cbd5e1"/>
    <!-- Adipose Fin (INTACT - Highlighted) -->
    <path d="M 235,92 Q 248,70 258,95 Z" fill="#ef4444" stroke="#f87171" stroke-width="2"/>
    <circle cx="247" cy="85" r="20" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="3,3"/>
    
    <text x="170" y="200" text-anchor="middle" class="status-bad">100% PROTECTED YEAR-ROUND</text>
    <text x="170" y="220" text-anchor="middle" style="fill:#e2e8f0; font-size:12px;">全年绝对保护 • 必须在水中摘钩立即放生</text>
    <text x="170" y="238" text-anchor="middle" style="fill:#94a3b8; font-size:11px;">Illegal killing carries €3,260 fine per fish</text>
  </g>

  <!-- Right: Stocked Trout -->
  <g transform="translate(420, 80)">
    <rect width="340" height="250" class="box-good"/>
    <text x="170" y="28" text-anchor="middle" class="status-good">✅ STOCKED TROUT • RASVAEVÄLEIKATTU</text>
    <text x="170" y="48" text-anchor="middle" class="sub">Adipose fin CLIPPED • 脂鳍已剪除（留平整平滑疤）</text>
    
    <!-- Fish outline without adipose fin -->
    <path d="M 40,140 Q 90,85 180,85 Q 240,88 280,115 L 300,90 L 300,165 L 280,140 Q 220,165 150,165 Q 90,165 40,140 Z" fill="#2d3748" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Dorsal Fin -->
    <path d="M 140,85 L 165,55 L 185,85 Z" fill="#475569" stroke="#cbd5e1"/>
    <!-- Adipose Fin Area (CLIPPED) -->
    <line x1="235" y1="96" x2="258" y2="102" stroke="#10b981" stroke-width="3"/>
    <circle cx="247" cy="98" r="18" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="247" y="65" text-anchor="middle" style="fill:#34d399; font-size:11px; font-weight:700;">NO FIN (SCAR)</text>

    <text x="170" y="200" text-anchor="middle" class="status-good">LEGAL TO KEEP AT ≥ 50 CM</text>
    <text x="170" y="220" text-anchor="middle" style="fill:#e2e8f0; font-size:12px;">体长满 50 厘米方可合法保留</text>
    <text x="170" y="238" text-anchor="middle" style="fill:#94a3b8; font-size:11px;">Must observe river autumn closed seasons</text>
  </g>
</svg>