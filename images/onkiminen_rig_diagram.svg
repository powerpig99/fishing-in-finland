<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" width="100%" height="auto" style="background:#070d18; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; border-radius: 10px; border: 1px solid #1e293b;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#0369a1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#075985" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="bedGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#261a10"/>
      <stop offset="100%" stop-color="#140d08"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="strikeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.95"/>
    </linearGradient>
    <!-- Drop Shadow Filter -->
    <filter id="cardShadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <style>
    .header-pill { fill: #0284c7; font-size: 11px; font-weight: 700; letter-spacing: 0.8px; }
    .main-title { fill: #f8fafc; font-size: 16px; font-weight: 800; letter-spacing: 0.3px; }
    .sub-title { fill: #94a3b8; font-size: 12px; }
    .card-title { font-size: 13px; font-weight: 700; }
    .card-desc { fill: #cbd5e1; font-size: 11.5px; }
    .card-desc-sub { fill: #94a3b8; font-size: 11px; }
    .card-zh { fill: #e2e8f0; font-size: 11.5px; }
    .badge-text { fill: #ffffff; font-size: 11px; font-weight: 800; text-anchor: middle; dominant-baseline: central; }
    .water-text { fill: #38bdf8; font-size: 11px; font-weight: 600; }
    .bed-text { fill: #d97706; font-size: 11px; font-weight: 600; }
    .leader-line { stroke: #475569; stroke-width: 1.2; stroke-dasharray: 4,3; opacity: 0.7; }
  </style>

  <!-- ================================================================= -->
  <!-- 1. HEADER BANNER                                                  -->
  <!-- ================================================================= -->
  <rect x="360" y="14" width="240" height="20" rx="10" fill="#0369a1" fill-opacity="0.3" stroke="#0284c7" stroke-width="1"/>
  <text x="480" y="24" text-anchor="middle" class="header-pill">EVERYMAN'S RIGHTS • ONKILAITE</text>
  
  <text x="480" y="48" text-anchor="middle" class="main-title">TRADITIONAL HOOK-AND-LINE RIG • 手竿浮漂钓组全景图解</text>
  <text x="480" y="67" text-anchor="middle" class="sub-title">100% Free under Finnish Law (Yleiskalastusoikeus) • No Reel • Natural Bait Only • Zero Permit</text>

  <!-- ================================================================= -->
  <!-- 2. WATER COLUMN & LAKEBED BACKGROUND                              -->
  <!-- ================================================================= -->
  <!-- Water Column Box -->
  <rect x="35" y="155" width="410" height="315" fill="url(#waterGrad)" rx="6"/>

  <!-- Water Surface Line -->
  <line x1="35" y1="155" x2="445" y2="155" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="6,4"/>
  <text x="45" y="147" class="water-text">Water Surface (Vedenpinta / 水面)</text>

  <!-- Lakebed / Seabed -->
  <rect x="35" y="470" width="410" height="60" fill="url(#bedGrad)" rx="4"/>
  <line x1="35" y1="470" x2="445" y2="470" stroke="#92400e" stroke-width="2.5"/>
  <!-- Decorative stones on bed -->
  <ellipse cx="90" cy="482" rx="12" ry="5" fill="#451a03" opacity="0.7"/>
  <ellipse cx="160" cy="486" rx="8" ry="4" fill="#361502" opacity="0.8"/>
  <ellipse cx="320" cy="481" rx="15" ry="6" fill="#451a03" opacity="0.6"/>
  <ellipse cx="390" cy="485" rx="10" ry="4" fill="#361502" opacity="0.7"/>
  <text x="45" y="505" class="bed-text">Lakebed / Seabed (Pohja / 泥沙碎石底)</text>

  <!-- ================================================================= -->
  <!-- 3. RIG GRAPHIC ELEMENTS                                           -->
  <!-- ================================================================= -->
  <!-- Telescopic Pole Blank Tip (Top Left) -->
  <path d="M 35,92 L 120,114" stroke="#475569" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M 120,114 L 148,121" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <!-- Tip connector loop (Stonfo / knot braid) -->
  <circle cx="150" cy="122" r="4.5" fill="#ef4444"/>

  <!-- Monofilament Mainline (Gentle catenary curve to float) -->
  <path d="M 152,123 Q 185,126 230,135" stroke="#38bdf8" stroke-width="1.8" fill="none"/>

  <!-- Float (Koho) at x=230 -->
  <!-- Antenna (protrudes 25px above water surface y=155) -->
  <line x1="230" y1="135" x2="230" y2="145" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="230" y1="145" x2="230" y2="152" stroke="#facc15" stroke-width="3.5"/>
  <line x1="230" y1="152" x2="230" y2="157" stroke="#0f172a" stroke-width="3.5"/>
  <!-- Float Body (Balsa egg shape below water line) -->
  <ellipse cx="230" cy="174" rx="8.5" ry="17" fill="#f8fafc" stroke="#0284c7" stroke-width="1.5"/>
  <!-- Float accent waist band -->
  <path d="M 221.7,174 Q 230,177 238.3,174" stroke="#0284c7" stroke-width="2" fill="none"/>
  <!-- Float carbon stem -->
  <line x1="230" y1="191" x2="230" y2="232" stroke="#334155" stroke-width="2"/>
  <!-- Silicone connector sleeves (Silikoniletkut) -->
  <rect x="227" y="202" width="6" height="5" fill="#f59e0b" rx="1.5"/>
  <rect x="227" y="222" width="6" height="5" fill="#f59e0b" rx="1.5"/>

  <!-- Underwater Mainline descending straight down -->
  <line x1="230" y1="232" x2="230" y2="355" stroke="#38bdf8" stroke-width="1.6"/>

  <!-- Split Shot Sinkers (Haulipainot) -->
  <!-- Sinker 1 (Large 0.8g) -->
  <circle cx="230" cy="355" r="4.5" fill="#64748b" stroke="#334155" stroke-width="1"/>
  <!-- Sinker 2 (Medium 0.5g) -->
  <circle cx="230" cy="367" r="4" fill="#64748b" stroke="#334155" stroke-width="1"/>
  <!-- Sinker 3 (Medium-small 0.4g) -->
  <circle cx="230" cy="378" r="3.5" fill="#64748b" stroke="#334155" stroke-width="1"/>
  <!-- Dropper line to tell-tale shot -->
  <line x1="230" y1="381.5" x2="230" y2="400" stroke="#38bdf8" stroke-width="1.3"/>
  <!-- Tell-tale shot (Signaalihapuli 0.2g) -->
  <circle cx="230" cy="400" r="2.8" fill="#94a3b8" stroke="#475569" stroke-width="1"/>

  <!-- Leader to hook -->
  <line x1="230" y1="403" x2="230" y2="435" stroke="#38bdf8" stroke-width="1.2"/>

  <!-- Single Hook (#12) and Live Earthworm -->
  <!-- Hook Shank, Bend & Barb -->
  <path d="M 230,435 L 230,446 Q 230,454 237,454 Q 244,454 244,446 L 244,441" fill="none" stroke="#f1f5f9" stroke-width="2"/>
  <!-- Fresh wriggling earthworm (Mato) threaded onto hook -->
  <path d="M 223,442 C 226,444 233,443 234,447 C 235,452 239,455 246,451 C 251,448 256,453 253,458 C 251,462 245,463 242,460" 
        fill="none" stroke="#f43f5e" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Strike Zone Bracket (10-20 cm off bottom) -->
  <line x1="180" y1="440" x2="192" y2="440" stroke="#10b981" stroke-width="1.8"/>
  <line x1="180" y1="470" x2="192" y2="470" stroke="#10b981" stroke-width="1.8"/>
  <line x1="186" y1="440" x2="186" y2="470" stroke="#10b981" stroke-width="1.8"/>
  <text x="176" y="452" text-anchor="end" fill="#10b981" font-size="11.5px" font-weight="800">10–20 cm</text>
  <text x="176" y="465" text-anchor="end" fill="#34d399" font-size="10px" font-weight="600">离底黄金水层</text>

  <!-- ================================================================= -->
  <!-- 4. LEADER LINES CONNECTING GRAPHIC TO CARDS                       -->
  <!-- ================================================================= -->
  <!-- Leader to Card 1 (Tip) -->
  <path d="M 155,122 L 465,122" class="leader-line"/>
  <!-- Leader to Card 2 (Float) -->
  <path d="M 242,160 L 465,212" class="leader-line"/>
  <!-- Leader to Card 3 (Split shots) -->
  <path d="M 238,370 L 465,302" class="leader-line"/>
  <!-- Leader to Card 4 (Hook & worm) -->
  <path d="M 255,448 L 465,392" class="leader-line"/>
  <!-- Leader to Card 5 (Strike zone) -->
  <path d="M 192,455 L 465,482" class="leader-line"/>

  <!-- ================================================================= -->
  <!-- 5. ANNOTATION CARDS (RIGHT COLUMN: x=465 to x=925, width=460)     -->
  <!-- ================================================================= -->

  <!-- CARD 1: Pole Tip & Connection -->
  <g filter="url(#cardShadow)">
    <rect x="465" y="85" width="460" height="74" rx="8" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.2"/>
    <!-- Number Badge -->
    <circle cx="488" cy="106" r="11" fill="#0284c7"/>
    <text x="488" y="106" class="badge-text">1</text>
    <!-- Card Title -->
    <text x="508" y="104" fill="#38bdf8" class="card-title">Pole Tip &amp; Line Connection (Vavan kärki / 竿尖连接)</text>
    <!-- Card Content -->
    <text x="508" y="122" class="card-desc">4m–6m telescopic carbon/glass pole • 0.18–0.22mm monofilament mainline</text>
    <text x="508" y="141" class="card-zh">无轮伸缩竿梢：马蹄活结套牢红绳（受力越拉越紧，向外轻推一秒解开）</text>
  </g>

  <!-- CARD 2: Sensitive Float & Sliding Depth -->
  <g filter="url(#cardShadow)">
    <rect x="465" y="171" width="460" height="82" rx="8" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.2"/>
    <!-- Number Badge -->
    <circle cx="488" cy="193" r="11" fill="#d97706"/>
    <text x="488" y="193" class="badge-text">2</text>
    <!-- Card Title -->
    <text x="508" y="191" fill="#fbbf24" class="card-title">Sensitive Float &amp; Depth (Onkikoho / 灵敏立漂与调深)</text>
    <!-- Card Content -->
    <text x="508" y="209" class="card-desc">1.5g–3g slim antenna float fixed with yellow silicone sleeves (Silikoniletkut)</text>
    <text x="508" y="225" class="card-desc-sub">Slide sleeves along mainline to set depth: only bright red/yellow tip pokes out</text>
    <text x="508" y="242" class="card-zh">上下推移硅胶管快速定水深：铅坠悬空时仅让鲜艳红黄漂尾露出水面</text>
  </g>

  <!-- CARD 3: Split Shot Weights -->
  <g filter="url(#cardShadow)">
    <rect x="465" y="265" width="460" height="76" rx="8" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.2"/>
    <!-- Number Badge -->
    <circle cx="488" cy="286" r="11" fill="#475569"/>
    <text x="488" y="286" class="badge-text">3</text>
    <!-- Card Title -->
    <text x="508" y="284" fill="#94a3b8" class="card-title">Split Shot Weights (Haulipainot / 梯级开口咬铅)</text>
    <!-- Card Content -->
    <text x="508" y="302" class="card-desc">Graduated split shots (0.4g–0.8g) clamped 20–30 cm above hook</text>
    <text x="508" y="318" class="card-desc-sub">Balances float buoyancy so perch feel zero resistance on the inhale</text>
    <text x="508" y="333" class="card-zh">精确配铅消除浮力阻力：底栖鱼轻啄即黑漂，小信标铅（Dropper）侦测顿口</text>
  </g>

  <!-- CARD 4: Hook & Live Bait -->
  <g filter="url(#cardShadow)">
    <rect x="465" y="353" width="460" height="76" rx="8" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.2"/>
    <!-- Number Badge -->
    <circle cx="488" cy="374" r="11" fill="#e11d48"/>
    <text x="488" y="374" class="badge-text">4</text>
    <!-- Card Title -->
    <text x="508" y="372" fill="#fb7185" class="card-title">Single Hook &amp; Live Worm (Koukku ja mato / 细条单钩与活蚯蚓)</text>
    <!-- Card Content -->
    <text x="508" y="390" class="card-desc">#10–#14 round bend hook baited with fresh earthworm (Kastemato)</text>
    <text x="508" y="406" class="card-desc-sub">Hook through head collar twice; leave 1–2 cm lively tail wriggling free</text>
    <text x="508" y="421" class="card-zh">穿过蚯蚓头部肉圈两次，务必留 1–2cm 鲜活蠕动尾部散发水下信息素</text>
  </g>

  <!-- CARD 5: September Bottom Tactic (Strike Zone) -->
  <g filter="url(#cardShadow)">
    <rect x="465" y="441" width="460" height="82" rx="8" fill="url(#strikeGrad)" stroke="#059669" stroke-width="1.5"/>
    <!-- Icon Badge -->
    <circle cx="488" cy="463" r="11" fill="#059669"/>
    <text x="488" y="463" class="badge-text">🎯</text>
    <!-- Card Title -->
    <text x="508" y="461" fill="#34d399" class="card-title">September Strike Zone: 10–20 cm Off Bottom (Syyskuun pohjataktiikka)</text>
    <!-- Card Content -->
    <text x="508" y="479" class="card-desc">Autumn cooling drops Perch &amp; Roach to deep pier bottoms (3–6m).</text>
    <text x="508" y="495" class="card-desc-sub">Suspending 10–20 cm off the seabed prevents weed foul and hits the strike zone.</text>
    <text x="508" y="512" class="card-zh">九月水冷鱼沉底：让蚯蚓悬垂离底 10–20 厘米，不挂淤泥枯叶，正合鱼口！</text>
  </g>

</svg>
