<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="auto" style="background:#0d1117; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif; border-radius:8px;">
  <text x="300" y="32" text-anchor="middle" fill="#f0f3f6" font-size="16" font-weight="700">ICE SAFETY PICKS (JÄÄNASKALIT) • 冰上救生安全锥</text>
  <text x="300" y="52" text-anchor="middle" fill="#8b949e" font-size="12">Mandatory life-saving neck gear: self-rescue grip when breaking through ice</text>

  <!-- Neck Cord -->
  <path d="M 210,130 Q 300,70 390,130" fill="none" stroke="#ef4444" stroke-width="4" stroke-dasharray="6,4"/>
  <text x="300" y="95" text-anchor="middle" fill="#f87171" font-size="11" font-weight="600">Neck Cord (Always Worn on Chest)</text>

  <!-- Left Pick -->
  <g transform="translate(180, 120)">
    <!-- Handle -->
    <rect x="-18" y="0" width="36" height="110" rx="8" fill="#eab308" stroke="#ca8a04" stroke-width="2"/>
    <line x1="-12" y1="30" x2="12" y2="30" stroke="#a16207" stroke-width="2"/>
    <line x1="-12" y1="50" x2="12" y2="50" stroke="#a16207" stroke-width="2"/>
    <line x1="-12" y1="70" x2="12" y2="70" stroke="#a16207" stroke-width="2"/>
    <!-- Metal Spike -->
    <polygon points="-6,110 6,110 0,165" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Whistle -->
    <circle cx="0" cy="-8" r="7" fill="#ef4444"/>
  </g>

  <!-- Right Pick -->
  <g transform="translate(420, 120)">
    <!-- Handle -->
    <rect x="-18" y="0" width="36" height="110" rx="8" fill="#eab308" stroke="#ca8a04" stroke-width="2"/>
    <line x1="-12" y1="30" x2="12" y2="30" stroke="#a16207" stroke-width="2"/>
    <line x1="-12" y1="50" x2="12" y2="50" stroke="#a16207" stroke-width="2"/>
    <line x1="-12" y1="70" x2="12" y2="70" stroke="#a16207" stroke-width="2"/>
    <!-- Metal Spike -->
    <polygon points="-6,110 6,110 0,165" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Whistle -->
    <circle cx="0" cy="-8" r="7" fill="#ef4444"/>
  </g>

  <rect x="150" y="270" width="300" height="30" rx="6" fill="rgba(56,189,248,0.1)" stroke="#38bdf8"/>
  <text x="300" y="290" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="600">Price: ~€8–€12 at Motonet or Prisma</text>
</svg>