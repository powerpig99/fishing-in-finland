<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="100%" height="auto" style="background:#0d1117; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif; border-radius: 8px;">
  <style>
    .title { fill: #f0f3f6; font-size: 16px; font-weight: 700; }
    .sub { fill: #8b949e; font-size: 12px; }
    .label { fill: #e2e8f0; font-size: 12px; }
    .accent { fill: #38bdf8; font-weight: 700; font-size: 13px; }
  </style>
  <text x="400" y="28" text-anchor="middle" class="title">SPRING WHITEFISH BOTTOM RIG (SIIANONGINTA) • 春季沙滩沉底白鲑钓组</text>
  <text x="400" y="48" text-anchor="middle" class="sub">Free under Everyman's Rights when using a single un-reeled line, or with Fisheries Fee when cast with spinning rod</text>

  <!-- Sandy Seabed -->
  <path d="M 40,220 L 760,220 L 760,265 L 40,265 Z" fill="#78350f" opacity="0.3"/>
  <line x1="40" y1="220" x2="760" y2="220" stroke="#d97706" stroke-width="2"/>
  <text x="50" y="245" style="fill:#fde68a; font-size:11px;">Sandy Seabed (Hiekkapohja / 浅海沙底水深1-3米)</text>

  <!-- Main Line from Rod -->
  <line x1="60" y1="90" x2="300" y2="180" stroke="#38bdf8" stroke-width="2"/>
  <text x="140" y="115" class="label">Mainline (0.14-0.18mm)</text>

  <!-- Sinker on Slider -->
  <circle cx="300" cy="180" r="4" fill="#cbd5e1"/>
  <line x1="300" y1="180" x2="300" y2="218" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 292,218 L 308,218 L 304,202 L 296,202 Z" fill="#94a3b8" stroke="#cbd5e1"/>
  <text x="300" y="160" text-anchor="middle" class="accent">Running Sinker (20-40g)</text>
  <text x="300" y="142" text-anchor="middle" class="sub">通心活铅坠（自由滑动）</text>

  <!-- Buffer Bead and Swivel -->
  <circle cx="350" cy="180" r="5" fill="#f59e0b"/>
  <rect x="370" y="175" width="20" height="10" rx="3" fill="#64748b"/>
  <text x="370" y="155" text-anchor="middle" class="label">Swivel + Bead (八字环)</text>

  <!-- Fluorocarbon Leader -->
  <line x1="390" y1="180" x2="650" y2="210" stroke="#34d399" stroke-width="1.8" stroke-dasharray="6,2"/>
  <text x="520" y="170" text-anchor="middle" class="accent">Fluorocarbon Leader (60–80 cm)</text>
  <text x="520" y="188" text-anchor="middle" class="sub">0.20-0.25mm 隐形碳线前导</text>

  <!-- Hook & Bait -->
  <circle cx="650" cy="210" r="3" fill="#cbd5e1"/>
  <path d="M 650,210 Q 660,225 675,215" fill="none" stroke="#f87171" stroke-width="2.5"/>
  <text x="680" y="185" class="accent">Hook (#6–#8) + Earthworm</text>
  <text x="680" y="202" class="sub">带倒刺蚯蚓钩配整条新鲜红蚯蚓</text>
</svg>