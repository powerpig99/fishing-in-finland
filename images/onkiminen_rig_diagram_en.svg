<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="auto" style="background:#070d18; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; border-radius: 12px; border: 1px solid #1e293b;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="waterGradEn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#0369a1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#075985" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="bedGradEn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#261a10"/>
      <stop offset="100%" stop-color="#140d08"/>
    </linearGradient>
    <linearGradient id="cardGradEn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.80"/>
    </linearGradient>
    <linearGradient id="strikeGradEn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.95"/>
    </linearGradient>
    <!-- Drop Shadow Filter -->
    <filter id="shadowEn" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <style>
    .header-pill { fill: #38bdf8; font-size: 11px; font-weight: 700; letter-spacing: 0.8px; }
    .main-title { fill: #f8fafc; font-size: 17px; font-weight: 800; letter-spacing: 0.4px; }
    .sub-title { fill: #94a3b8; font-size: 12.5px; }
    .card-title { font-size: 14px; font-weight: 700; letter-spacing: 0.2px; }
    .card-desc { fill: #f1f5f9; font-size: 12.5px; font-weight: 500; }
    .card-desc-sub { fill: #94a3b8; font-size: 12px; }
    .badge-text { fill: #ffffff; font-size: 12px; font-weight: 800; text-anchor: middle; dominant-baseline: central; }
    .water-text { fill: #38bdf8; font-size: 11.5px; font-weight: 600; }
    .bed-text { fill: #d97706; font-size: 11.5px; font-weight: 600; }
    .leader-line { stroke: #475569; stroke-width: 1.2; stroke-dasharray: 4,3; opacity: 0.7; }
  </style>

  <!-- ================================================================= -->
  <!-- 1. HEADER BANNER                                                  -->
  <!-- ================================================================= -->
  <rect x="330" y="14" width="340" height="22" rx="11" fill="#0369a1" fill-opacity="0.3" stroke="#0284c7" stroke-width="1"/>
  <text x="500" y="25" text-anchor="middle" class="header-pill">EVERYMAN'S RIGHTS (YLEISKALASTUSOIKEUS) • 100% FREE</text>
  
  <text x="500" y="50" text-anchor="middle" class="main-title">TRADITIONAL HOOK-AND-LINE RIG (ONKILAITE)</text>
  <text x="500" y="69" text-anchor="middle" class="sub-title">No Reel • Telescopic Pole (4m–6m) • Natural Live Bait • Zero Permit Required</text>

  <!-- ================================================================= -->
  <!-- 2. WATER COLUMN & LAKEBED BACKGROUND                              -->
  <!-- ================================================================= -->
  <!-- Water Column Box -->
  <rect x="35" y="155" width="375" height="315" fill="url(#waterGradEn)" rx="6"/>

  <!-- Water Surface Line -->
  <line x1="35" y1="155" x2="410" y2="155" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="6,4"/>
  <text x="45" y="147" class="water-text">Water Surface (Vedenpinta)</text>

  <!-- Lakebed / Seabed -->
  <rect x="35" y="470" width="375" height="65" fill="url(#bedGradEn)" rx="4"/>
  <line x1="35" y1="470" x2="410" y2="470" stroke="#92400e" stroke-width="2.5"/>
  <!-- Decorative stones on bed -->
  <ellipse cx="85" cy="482" rx="12" ry="5" fill="#451a03" opacity="0.7"/>
  <ellipse cx="150" cy="486" rx="8" ry="4" fill="#361502" opacity="0.8"/>
  <ellipse cx="290" cy="481" rx="15" ry="6" fill="#451a03" opacity="0.6"/>
  <ellipse cx="360" cy="485" rx="10" ry="4" fill="#361502" opacity="0.7"/>
  <text x="45" y="505" class="bed-text">Lakebed / Seabed (Pohja)</text>

  <!-- ================================================================= -->
  <!-- 3. RIG GRAPHIC ELEMENTS                                           -->
  <!-- ================================================================= -->
  <!-- Telescopic Pole Blank Tip (Top Left) -->
  <path d="M 35,90 L 115,114" stroke="#475569" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M 115,114 L 144,121" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <!-- Tip connector loop (Stonfo / knot braid) -->
  <circle cx="146" cy="122" r="4.5" fill="#ef4444"/>

  <!-- Monofilament Mainline (Curve to float) -->
  <path d="M 148,123 Q 175,126 215,135" stroke="#38bdf8" stroke-width="1.8" fill="none"/>

  <!-- Float (Koho) at x=215 -->
  <!-- Antenna (protrudes 25px above water surface y=155) -->
  <line x1="215" y1="135" x2="215" y2="145" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="215" y1="145" x2="215" y2="152" stroke="#facc15" stroke-width="3.5"/>
  <line x1="215" y1="152" x2="215" y2="157" stroke="#0f172a" stroke-width="3.5"/>
  <!-- Float Body (Balsa egg shape below water line) -->
  <ellipse cx="215" cy="174" rx="8.5" ry="17" fill="#f8fafc" stroke="#0284c7" stroke-width="1.5"/>
  <!-- Float accent waist band -->
  <path d="M 206.7,174 Q 215,177 223.3,174" stroke="#0284c7" stroke-width="2" fill="none"/>
  <!-- Float carbon stem -->
  <line x1="215" y1="191" x2="215" y2="232" stroke="#334155" stroke-width="2"/>
  <!-- Silicone connector sleeves (Silikoniletkut) -->
  <rect x="212" y="202" width="6" height="5" fill="#f59e0b" rx="1.5"/>
  <rect x="212" y="222" width="6" height="5" fill="#f59e0b" rx="1.5"/>

  <!-- Protruding Antenna Indicator Bracket on Float -->
  <line x1="230" y1="135" x2="242" y2="135" stroke="#ef4444" stroke-width="1.2"/>
  <line x1="230" y1="155" x2="242" y2="155" stroke="#38bdf8" stroke-width="1.2"/>
  <line x1="236" y1="135" x2="236" y2="155" stroke="#facc15" stroke-width="1.2"/>
  <text x="248" y="148" fill="#facc15" font-size="10.5px" font-weight="600">1–2 cm visible tip</text>

  <!-- Underwater Mainline descending straight down -->
  <line x1="215" y1="232" x2="215" y2="355" stroke="#38bdf8" stroke-width="1.6"/>

  <!-- Split Shot Sinkers (Haulipainot) -->
  <circle cx="215" cy="355" r="4.5" fill="#64748b" stroke="#334155" stroke-width="1"/>
  <circle cx="215" cy="367" r="4" fill="#64748b" stroke="#334155" stroke-width="1"/>
  <circle cx="215" cy="378" r="3.5" fill="#64748b" stroke="#334155" stroke-width="1"/>
  <!-- Dropper line to tell-tale shot -->
  <line x1="215" y1="381.5" x2="215" y2="400" stroke="#38bdf8" stroke-width="1.3"/>
  <circle cx="215" cy="400" r="2.8" fill="#94a3b8" stroke="#475569" stroke-width="1"/>

  <!-- Leader to hook -->
  <line x1="215" y1="403" x2="215" y2="435" stroke="#38bdf8" stroke-width="1.2"/>

  <!-- Single Hook (#12) and Live Earthworm -->
  <path d="M 215,435 L 215,446 Q 215,454 222,454 Q 229,454 229,446 L 229,441" fill="none" stroke="#f1f5f9" stroke-width="2"/>
  <!-- Fresh wriggling earthworm (Mato) -->
  <path d="M 208,442 C 211,444 218,443 219,447 C 220,452 224,455 231,451 C 236,448 241,453 238,458 C 236,462 230,463 227,460" 
        fill="none" stroke="#f43f5e" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Strike Zone Bracket (10-20 cm off bottom) -->
  <line x1="165" y1="440" x2="177" y2="440" stroke="#10b981" stroke-width="1.8"/>
  <line x1="165" y1="470" x2="177" y2="470" stroke="#10b981" stroke-width="1.8"/>
  <line x1="171" y1="440" x2="171" y2="470" stroke="#10b981" stroke-width="1.8"/>
  <text x="160" y="452" text-anchor="end" fill="#10b981" font-size="12px" font-weight="800">10–20 cm</text>
  <text x="160" y="466" text-anchor="end" fill="#34d399" font-size="10.5px" font-weight="600">Strike Zone</text>

  <!-- ================================================================= -->
  <!-- 4. LEADER LINES CONNECTING GRAPHIC TO CARDS                       -->
  <!-- ================================================================= -->
  <path d="M 152,122 L 435,121" class="leader-line"/>
  <path d="M 227,170 L 435,214" class="leader-line"/>
  <path d="M 223,370 L 435,307" class="leader-line"/>
  <path d="M 240,448 L 435,397" class="leader-line"/>
  <path d="M 177,455 L 435,490" class="leader-line"/>

  <!-- ================================================================= -->
  <!-- 5. ANNOTATION CARDS (RIGHT COLUMN: x=435 to x=965, width=530)     -->
  <!-- ================================================================= -->

  <!-- CARD 1: Pole Tip & Connection -->
  <g filter="url(#shadowEn)">
    <rect x="435" y="82" width="530" height="78" rx="8" fill="url(#cardGradEn)" stroke="#1e293b" stroke-width="1.2"/>
    <circle cx="460" cy="106" r="12" fill="#0284c7"/>
    <text x="460" y="106" class="badge-text">1</text>
    <text x="484" y="104" fill="#38bdf8" class="card-title">Pole Tip &amp; Line Connection (Vavan kärki / Stonfo)</text>
    <text x="484" y="125" class="card-desc">4m–6m telescopic carbon/fiberglass whip pole • 0.18–0.22mm monofilament</text>
    <text x="484" y="144" class="card-desc-sub">Tie a double slipknot over the tip braid: grips tighter under load, releases in 1 second.</text>
  </g>

  <!-- CARD 2: Sensitive Float & Sliding Depth -->
  <g filter="url(#shadowEn)">
    <rect x="435" y="172" width="530" height="84" rx="8" fill="url(#cardGradEn)" stroke="#1e293b" stroke-width="1.2"/>
    <circle cx="460" cy="197" r="12" fill="#d97706"/>
    <text x="460" y="197" class="badge-text">2</text>
    <text x="484" y="195" fill="#fbbf24" class="card-title">Sensitive Float &amp; Depth Adjustment (Onkikoho &amp; Syvyyssäätö)</text>
    <text x="484" y="216" class="card-desc">1.5g–3g slim antenna float fixed via sliding silicone sleeves (Silikoniletkut)</text>
    <text x="484" y="235" class="card-desc-sub">Slide sleeves along line to set depth: calibrate so only the bright red/yellow tip pokes out.</text>
  </g>

  <!-- CARD 3: Split Shot Weights -->
  <g filter="url(#shadowEn)">
    <rect x="435" y="268" width="530" height="78" rx="8" fill="url(#cardGradEn)" stroke="#1e293b" stroke-width="1.2"/>
    <circle cx="460" cy="292" r="12" fill="#475569"/>
    <text x="460" y="292" class="badge-text">3</text>
    <text x="484" y="290" fill="#94a3b8" class="card-title">Split Shot Calibration (Haulipainot &amp; Tasapainotus)</text>
    <text x="484" y="311" class="card-desc">Graduated split shots (0.4g–0.8g) pinched 20–25 cm above hook + dropper shot</text>
    <text x="484" y="330" class="card-desc-sub">Balances float buoyancy perfectly so biting fish feel zero resistance on the inhale.</text>
  </g>

  <!-- CARD 4: Hook & Live Bait -->
  <g filter="url(#shadowEn)">
    <rect x="435" y="358" width="530" height="78" rx="8" fill="url(#cardGradEn)" stroke="#1e293b" stroke-width="1.2"/>
    <circle cx="460" cy="382" r="12" fill="#e11d48"/>
    <text x="460" y="382" class="badge-text">4</text>
    <text x="484" y="380" fill="#fb7185" class="card-title">Single Hook &amp; Live Worm (Koukku ja syötti)</text>
    <text x="484" y="401" class="card-desc">#10–#14 round bend single hook baited with fresh earthworm (Kastemato)</text>
    <text x="484" y="420" class="card-desc-sub">Thread hook twice through the head collar; leave 1–2 cm lively tail wriggling free.</text>
  </g>

  <!-- CARD 5: September Bottom Tactic (Strike Zone) -->
  <g filter="url(#shadowEn)">
    <rect x="435" y="448" width="530" height="84" rx="8" fill="url(#strikeGradEn)" stroke="#059669" stroke-width="1.5"/>
    <circle cx="460" cy="473" r="12" fill="#059669"/>
    <text x="460" y="473" class="badge-text">🎯</text>
    <text x="484" y="471" fill="#34d399" class="card-title">September Strike Rule: Suspend 10–20 cm Off Bottom</text>
    <text x="484" y="492" class="card-desc">Cooling water (10–14°C) drives Perch &amp; Roach to deep pier bottoms (3–6m).</text>
    <text x="484" y="511" class="card-desc-sub">Suspending 10–20 cm above seabed prevents weed foul while placing bait right in front of fish!</text>
  </g>

</svg>
