<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="100%" height="auto" style="background:#0d1117; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif; border-radius:8px;">
  <text x="300" y="32" text-anchor="middle" fill="#f0f3f6" font-size="16" font-weight="700">LANDING NET, PRIEST &amp; FILLETING KNIFE</text>
  <text x="300" y="52" text-anchor="middle" fill="#8b949e" font-size="12">Essential catch care: rubber mesh protects fish slime; priest delivers instant humane dispatch</text>

  <!-- Landing net -->
  <g transform="translate(60, 90)">
    <rect x="0" y="40" width="120" height="12" rx="4" fill="#64748b"/>
    <ellipse cx="180" cy="46" rx="60" ry="40" fill="rgba(56,189,248,0.15)" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="180" y="110" text-anchor="middle" fill="#38bdf8" font-size="11">Rubber Net (Kumihavas)</text>
  </g>

  <!-- Priest (Kalapappi) -->
  <g transform="translate(360, 90)">
    <rect x="0" y="20" width="140" height="18" rx="6" fill="#a16207" stroke="#ca8a04" stroke-width="2"/>
    <circle cx="130" cy="29" r="16" fill="#ca8a04" stroke="#eab308" stroke-width="2"/>
    <text x="70" y="60" text-anchor="middle" fill="#fde047" font-size="11">Priest Club (Kalapappi / 击鱼棒)</text>

    <!-- Fillet Knife -->
    <path d="M 0,85 L 60,85 L 170,92 L 60,99 L 0,99 Z" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="-40" y="82" width="40" height="20" rx="3" fill="#1e293b" stroke="#475569"/>
    <text x="70" y="125" text-anchor="middle" fill="#cbd5e1" font-size="11">Filleting Knife (Filetti / 剔骨刀)</text>
  </g>
</svg>