<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="auto" style="background:#0d1117; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif; border-radius: 8px;">
  <style>
    .title { fill: #f0f3f6; font-size: 16px; font-weight: 700; }
    .sub { fill: #8b949e; font-size: 12px; }
    .step-box { stroke: #38bdf8; stroke-width: 1.5; fill: rgba(56,189,248,0.06); rx: 8; }
    .step-title { fill: #38bdf8; font-size: 14px; font-weight: 700; }
    .step-desc { fill: #e2e8f0; font-size: 12px; line-height: 1.5; }
  </style>
  <text x="400" y="28" text-anchor="middle" class="title">HUMANE DISPATCH &amp; BLEEDING PROTOCOL • 渔获人道处死与放血两步法</text>
  <text x="400" y="48" text-anchor="middle" class="sub">Finnish statutory animal welfare requirement: never leave fish to suffocate slowly</text>

  <!-- Step 1: Pappaus -->
  <g transform="translate(50, 70)">
    <rect width="330" height="200" class="step-box"/>
    <text x="20" y="32" class="step-title">STEP 1: STUNNING (PAPPAUS / 击晕)</text>
    <path d="M 40,120 Q 90,75 180,85 Q 260,100 280,125 L 300,105 L 300,155 L 280,135 Q 220,165 150,165 Q 90,160 40,120 Z" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="95" cy="100" r="4" fill="#fbbf24"/>
    <!-- Strike target -->
    <circle cx="120" cy="82" r="14" fill="none" stroke="#ef4444" stroke-width="2.5"/>
    <line x1="120" y1="55" x2="120" y2="78" stroke="#ef4444" stroke-width="3"/>
    <polygon points="115,75 125,75 120,83" fill="#ef4444"/>
    <text x="165" y="175" class="step-desc">Target: Top of skull directly behind eyes</text>
    <text x="165" y="190" class="sub">击鱼棒猛击双眼正后方头骨凸起处</text>
  </g>

  <!-- Step 2: Verestys -->
  <g transform="translate(420, 70)">
    <rect width="330" height="200" class="step-box"/>
    <text x="20" y="32" class="step-title">STEP 2: BLEEDING (VERESTYS / 放血)</text>
    <path d="M 40,120 Q 90,75 180,85 Q 260,100 280,125 L 300,105 L 300,155 L 280,135 Q 220,165 150,165 Q 90,160 40,120 Z" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="95" cy="100" r="4" fill="#fbbf24"/>
    <!-- Gill Cut -->
    <path d="M 115,95 Q 125,120 120,140" fill="none" stroke="#ef4444" stroke-width="3"/>
    <circle cx="120" cy="138" r="4" fill="#ef4444"/>
    <text x="165" y="175" class="step-desc">Cut gill arch artery &amp; bleed in cold water</text>
    <text x="165" y="190" class="sub">切断鳃弓动脉，倒悬于冰水中彻底排血</text>
  </g>
</svg>