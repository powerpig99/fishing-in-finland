<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="auto" style="background:#0d1117; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif; border-radius:8px;">
  <text x="300" y="32" text-anchor="middle" fill="#f0f3f6" font-size="16" font-weight="700">BALTIC HERRING RIG (SILAKANLITKA) • 鲱鱼反光串钩组</text>
  <text x="300" y="52" text-anchor="middle" fill="#8b949e" font-size="12">6–8 bare shiny gold hooks on short dropper loops + 30–50g bottom sinker</text>

  <!-- Main vertical line -->
  <line x1="280" y1="70" x2="280" y2="260" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- Dropper hooks -->
  <!-- Hook 1 -->
  <line x1="280" y1="95" x2="330" y2="95" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M 330,95 Q 345,105 340,115 Q 330,120 325,110" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
  <!-- Hook 2 -->
  <line x1="280" y1="135" x2="230" y2="135" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M 230,135 Q 215,145 220,155 Q 230,160 235,150" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
  <!-- Hook 3 -->
  <line x1="280" y1="175" x2="330" y2="175" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M 330,175 Q 345,185 340,195 Q 330,200 325,190" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
  <!-- Hook 4 -->
  <line x1="280" y1="215" x2="230" y2="215" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M 230,215 Q 215,225 220,235 Q 230,240 235,230" fill="none" stroke="#fbbf24" stroke-width="2.5"/>

  <!-- Bottom Sinker -->
  <circle cx="280" cy="265" r="4" fill="#94a3b8"/>
  <path d="M 270,295 L 290,295 L 285,268 L 275,268 Z" fill="#94a3b8" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="310" y="285" fill="#cbd5e1" font-size="12">35g Sinker (Paino)</text>

  <text x="360" y="105" fill="#fde047" font-size="11">Bare Gold Hooks (No bait!)</text>
  <text x="130" y="145" fill="#fde047" font-size="11">无饵反光小金钩</text>
</svg>